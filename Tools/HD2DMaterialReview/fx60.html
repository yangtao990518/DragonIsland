<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>60帧特效审阅 · mAIverse</title><link rel="stylesheet" href="style.css"><style>.inspect{max-width:720px;margin:auto}.inspect canvas{width:100%;max-width:480px;display:block;margin:24px auto;image-rendering:pixelated;border:1px solid #657064;border-radius:12px}.inspect .controls{flex-wrap:wrap;gap:12px}.inspect input[type=range]{width:100%;margin:24px 0}.inspect select{max-width:100%;padding:10px}.inspect p{line-height:1.8}.inspect output{font-variant-numeric:tabular-nums}button:disabled{opacity:.4}</style></head><body><header class="topbar"><a class="brand" href="index.html">mAIverse <span class="brand-sub">素材库</span></a><a href="index.html">返回等级预览 ↗</a></header><main class="inspect"><p class="eyebrow">ORIGINAL DRAWINGS / 60 Hz</p><h1>看清每一帧</h1><p>新生成的连续原画，按每秒60帧播放。可暂停、前后逐帧，检查轮廓、轨迹和循环接缝。</p><label>特效 <select id="asset" aria-label="选择原画特效"></select></label><canvas id="canvas" width="480" height="480" aria-label="原画逐帧预览"></canvas><output id="readout">准备素材…</output><input id="frame" type="range" min="0" value="0" aria-label="逐帧位置"><div class="controls"><button class="control" id="prev">← 上一帧</button><button class="control primary" id="play">暂停</button><button class="control" id="next">下一帧 →</button><button class="control" id="replay">从头重播</button><label>背景 <select id="background"><option value="#19212e">深蓝灰</option><option value="#ffffff">白色</option><option value="#000000">黑色</option><option value="#808080">中灰</option></select></label><label>速度 <select id="speed"><option value="1">1× 原速</option><option value="0.5">0.5× 慢放</option></select></label></div><p id="details"></p><p class="footnote">这是素材时间轴审阅，非iOS实机帧率测试。有限动作播完会停留片刻后重播；短暂停留不计入原片时长。原图、提示词、逐帧时序与来源哈希一同保存。</p><a href="assets/fx60-download.json" data-fx60-download>下载60帧原画及制作资料 ↗</a></main><script type="module" src="fx60-inspector.js"></script></body></html>
