<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新稿审阅 · mAIverse</title><link rel="stylesheet" href="style.css">
<style>main{max-width:1100px;margin:auto;padding:24px}h1{margin:24px 0 12px}.note{color:#b6b5ad;line-height:1.8}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0}.controls button{padding:10px 16px}.drafts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.draft{border:1px solid #45443b;border-radius:16px;padding:16px;min-width:0}.draft canvas{display:block;width:100%;max-width:320px;margin:auto;image-rendering:pixelated}.draft h2{font-size:20px}.landscape{width:100%;height:auto;display:block;border-radius:16px;margin-top:16px}a{color:#dccb98}input{max-width:200px}@media(max-width:600px){.drafts{grid-template-columns:1fr}main{padding:16px}}</style></head>
<body><main><nav class="library-nav" aria-label="素材分类"><a href="index.html">技能特效</a><a href="monsters.html">怪物图鉴</a><a href="candidates.html" aria-current="page">新稿审阅</a></nav>
<h1>土系与场景 · 新稿审阅</h1><p class="note">以下均是新原画候选，尚未启用。按原画16格顺序预览，不代表正式播放时序或1—5级组合效果。确认稿的人物、火球、雷与剑不被替换。</p>
<div class="controls"><button id="play" aria-pressed="true">暂停</button><button id="restart">重播</button><button id="background">切换浅底</button><label>逐帧 <input id="frame" type="range" min="0" max="15" value="0"></label><span id="counter">1 / 16</span></div><section class="drafts" id="drafts" aria-label="四项土系原画"></section>
<h2>有限草地 · 空间与光影方向</h2><p class="note">围墙厚度、前后景遮挡、暖光与冷阴影的概念方案。不是原生运行截图，不会把整张图铺成游戏背景。实际空间、分层地形和光照仍需逐项实现。</p><img class="landscape" src="../../Art/HD2DReview/2026-11-02/Candidates/grassland-lighting-study-v1.png" alt="有限草地的HD-2D光影概念"><p class="note">首次拉取后先运行 restore_sources.py。<a href="../../Art/HD2DReview/2026-11-02/Candidates/prompts.json">完整生成提示词</a> · <a href="../../Art/HD2DReview/2026-11-02/Candidates/validation-drafts.json">源文件尺寸与哈希</a>。本页仅本地源码，未另建或发布站点。</p>
<script>
const base='../../Art/HD2DReview/2026-11-02/Candidates/';
const specs=[['earth-spikes','地脉穿刺'],['stone-fist','岩拳升龙'],['boulder','巨岩砸地'],['quicksand','流沙地涡']];
let playing=true,dark=true,frame=0,started=performance.now();const cards=[];
for(const [id,title] of specs){const card=document.createElement('article');card.className='draft';const heading=document.createElement('h2');heading.textContent=title;const canvas=document.createElement('canvas');canvas.width=320;canvas.height=320;canvas.setAttribute('aria-label',title+'16格原画顺序预览');const status=document.createElement('p');status.className='note';status.textContent='读取原画…';card.append(heading,canvas,status);document.querySelector('#drafts').append(card);const image=new Image();image.onload=()=>{status.textContent='原画候选 · 尚未启用';draw()};image.onerror=()=>{status.textContent='无法读取源文件，请先恢复素材或检查路径。'};image.src=base+id+'-draft-v1.png';cards.push({canvas,image});}
function draw(){for(const {canvas,image} of cards){const ctx=canvas.getContext('2d');ctx.fillStyle=dark?'#171e2b':'#f5f2e9';ctx.fillRect(0,0,320,320);ctx.imageSmoothingEnabled=false;if(image.complete&&image.naturalWidth){const x=Math.floor(frame%4*image.width/4),y=Math.floor(Math.floor(frame/4)*image.height/4),right=Math.floor((frame%4+1)*image.width/4),bottom=Math.floor((Math.floor(frame/4)+1)*image.height/4);ctx.drawImage(image,x,y,right-x,bottom-y,0,0,320,320)}}document.querySelector('#counter').textContent=(frame+1)+' / 16';document.querySelector('#frame').value=frame;}
function animate(now){if(playing){const next=Math.floor((now-started)/150)%16;if(next!==frame){frame=next;draw()}}requestAnimationFrame(animate)}requestAnimationFrame(animate);
document.querySelector('#play').onclick=()=>{playing=!playing;started=performance.now()-frame*150;document.querySelector('#play').textContent=playing?'暂停':'播放';document.querySelector('#play').setAttribute('aria-pressed',String(playing))};
document.querySelector('#restart').onclick=()=>{frame=0;started=performance.now();draw()};document.querySelector('#frame').oninput=e=>{frame=Number(e.target.value);playing=false;document.querySelector('#play').textContent='播放';document.querySelector('#play').setAttribute('aria-pressed','false');draw()};document.querySelector('#background').onclick=()=>{dark=!dark;document.querySelector('#background').textContent=dark?'切换浅底':'切换深底';draw()};draw();
</script></main></body></html>
