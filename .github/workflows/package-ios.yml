name: Package current unsigned IPA

"on":
  workflow_dispatch:
  push:
    branches: [codex/character-chat]
    paths:
      - '.github/workflows/package-ios.yml'
      - 'Art/DailyMotions/**'

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 -m venv .asset-venv
          .asset-venv/bin/python -m pip install -r requirements-build.txt
          echo "$GITHUB_WORKSPACE/.asset-venv/bin" >> "$GITHUB_PATH"
      - name: Compile app and Widget, verify IPA resources
        id: build
        run: |
          swift test
          python3 Scripts/prepare_assets.py
          python3 -m unittest discover -s Tests -p 'test_*.py' -v
          bash Scripts/build_unsigned.sh
      - name: Record package validation scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          note = ('本包按用户要求优先提供 IPA。App / Widget 已编译，IPA 结构与资源检查通过。'
                  '本打包任务不执行模拟器界面与系统录像验收；真机签名和声音表现尚未验证。\n'
                  f'源码：{os.environ["GITHUB_SHA"]}\n'
                  f'构建：https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}\n')
          Path('output/BUILD_STATUS.md').write_text(note, encoding='utf-8')
          changes = Path('docs/RELEASE_BUILD${{ steps.build.outputs.build }}.md').read_text(encoding='utf-8')
          Path('output/CHANGELOG.md').write_text(changes + note, encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: mAIverse-V${{ steps.build.outputs.version }}-build${{ steps.build.outputs.build }}-unsigned
          path: |
            output/*.ipa
            output/*.md
            output/*.txt
          if-no-files-found: error
          retention-days: 7
