name: Check chat functionality

"on":
  push:
    branches: [codex/character-chat]
    paths:
      - 'App/**'
      - 'Shared/**'
      - 'Tests/**'
      - '.github/workflows/chat-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MAIVERSE_SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test chat domain, persistence and reply lifecycle
        run: |
          set -euo pipefail
          mkdir -p build
          swift test 2>&1 | tee build/chat-domain-tests.log
      - name: Prepare simulator resources
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 -m venv .asset-venv
          .asset-venv/bin/python -m pip install -r requirements-build.txt
          .asset-venv/bin/python Scripts/prepare_assets.py
          .asset-venv/bin/python Scripts/prepare_motion.py
          xcodegen generate --spec project.yml
      - name: Boot the iOS 26.2 iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys,os; d=json.load(sys.stdin); phones=[v for v in d["devices"].get(os.environ["MAIVERSE_SIM_RUNTIME"],[]) if v.get("isAvailable") and v["name"].startswith("iPhone")]; phones.sort(key=lambda v: ("Pro" not in v["name"],v["name"])); print(phones[0]["udid"])')"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
      - name: Compile app, Widget and chat tests (no IPA)
        run: |
          set -euo pipefail
          xcodebuild -project DragonIsland.xcodeproj -scheme DragonIsland \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/ChatTests \
            -only-testing:DragonInterfaceTests/ChatInterfaceTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build-for-testing 2>&1 | tee build/chat-build.log
      - name: Run chat interface tests
        run: |
          set -euo pipefail
          xcodebuild -project DragonIsland.xcodeproj -scheme DragonIsland \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/ChatTests -resultBundlePath build/ChatTests.xcresult \
            -only-testing:DragonInterfaceTests/ChatInterfaceTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test-without-building 2>&1 | tee build/chat-interface-tests.log
      - name: Export actual simulator screenshots
        if: always()
        run: |
          if [[ -d build/ChatTests.xcresult ]]; then
            mkdir -p output/chat-screenshots
            xcrun xcresulttool export attachments --path build/ChatTests.xcresult --output-path output/chat-screenshots
          fi
          if [[ -n "${DEVICE_ID:-}" ]]; then
            mkdir -p output/chat-screenshots
            xcrun simctl io "$DEVICE_ID" screenshot output/chat-screenshots/simulator-final.png || true
          fi
      - name: Save test screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chat-test-screenshots-and-logs
          path: |
            output/chat-screenshots/
            build/chat-domain-tests.log
            build/chat-build.log
            build/chat-interface-tests.log
          if-no-files-found: warn
          retention-days: 7
