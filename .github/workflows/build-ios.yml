name: Build iOS IPA

"on":
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build app + Live Activity
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: |
          xcodebuild -version
          SDK_MAJOR="$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)"
          test "$SDK_MAJOR" -ge 26 || { echo "AlarmKit requires the iOS 26 SDK"; exit 1; }

      - name: Install build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 -m venv .asset-venv
          .asset-venv/bin/python -m pip install -r requirements-build.txt
          echo "$GITHUB_WORKSPACE/.asset-venv/bin" >> "$GITHUB_PATH"

      - name: Test countdown and session state
        run: |
          swift test
          python3 -m unittest discover -s Tests -p 'test_*.py' -v

      - name: Build unsigned IPA and verify embedded extension
        id: build
        run: bash Scripts/build_unsigned.sh

      - name: Render actual app previews in iPhone simulator
        timeout-minutes: 15
        run: bash Scripts/capture_previews.sh

      - name: Downloadable IPA
        uses: actions/upload-artifact@v7
        with:
          name: mAIverse-V${{ steps.build.outputs.version }}-unsigned
          path: |
            output/*.ipa
            output/*.md
            output/*.txt
          if-no-files-found: error
          retention-days: 7

      - name: System motion review sheets and video analysis
        uses: actions/upload-artifact@v7
        with:
          name: mAIverse-V${{ steps.build.outputs.version }}-verification
          path: |
            output/verification/
            !output/verification/system-island-motion.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Original system motion video
        uses: actions/upload-artifact@v7
        with:
          name: mAIverse-V${{ steps.build.outputs.version }}-system-video
          path: output/verification/system-island-motion.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Original simulator screenshots
        uses: actions/upload-artifact@v7
        with:
          name: mAIverse-V${{ steps.build.outputs.version }}-screenshots
          path: |
            output/previews/
            output/ui-test-attachments/
          if-no-files-found: error
          retention-days: 7

      - name: Build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mAIverse-build-log
          path: |
            build/build.log
            build/simulator.log
            build/interface-tests.log
            build/InterfaceTests.xcresult
            output/previews/
            output/ui-test-attachments/
            output/verification/
          if-no-files-found: ignore
          retention-days: 7

