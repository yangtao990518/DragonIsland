name: DragonIsland
options:
  bundleIdPrefix: com.dragonisle.prototype
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  DragonIsland:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: mAIverse
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.dragonisle.prototype
            CFBundleURLSchemes: [dragonisle]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dragonisle.prototype.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DragonIslandWidget
        embed: true
  DragonIslandWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: mAIverse 实时活动
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dragonisle.prototype.app.widget
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
schemes:
  DragonIsland:
    build:
      targets:
        DragonIsland: all
    run:
      config: Debug
    archive:
      config: Release
