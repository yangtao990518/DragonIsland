name: DragonIsland
include:
  - motion-fonts.yml
options:
  bundleIdPrefix: com.dragonisle.prototype
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.8"
    CURRENT_PROJECT_VERSION: "14"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  DragonIsland:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: mAIverse
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: "让你选择的角色在约定时间通过系统闹钟播放语音提醒。"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.dragonisle.prototype
            CFBundleURLSchemes: [dragonisle]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dragonisle.prototype.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconClaude AppIconDeepSeek AppIconGemini AppIconGrok"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
    dependencies:
      - target: DragonIslandWidget
        embed: true
  DragonIslandWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: mAIverse 实时活动
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dragonisle.prototype.app.widget
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
  DragonInterfaceTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/DragonInterfaceTests
    info:
      path: Config/UITests-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dragonisle.prototype.uitests
        TEST_TARGET_NAME: DragonIsland
    dependencies:
      - target: DragonIsland
schemes:
  DragonIsland:
    build:
      targets:
        DragonIsland: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets:
        - DragonInterfaceTests

